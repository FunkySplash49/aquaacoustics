[pytest]
# Put `src/` on sys.path so tests can `from aeld import ...` without the
# package needing to be pip-installed. Requires pytest >= 7.0.
pythonpath = src

# Only look for tests in tests/ - keeps collection fast and avoids pytest
# trying to import setup.py (which is an installer, not a test module).
testpaths = tests

# Concise output by default: short tracebacks, quiet header.
addopts = -v --tb=short
